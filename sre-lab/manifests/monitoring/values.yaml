# values.yaml do kube-prometheus-stack (release: kps, namespace: monitoring)
#
#   helm install kps prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f values.yaml

grafana:
  service:
    type: LoadBalancer
  adminPassword: TROQUE_ESTA_SENHA
  plugins:
    - alexanderzobnin-zabbix-app

  # O datasource do Zabbix foi adicionado pela UI (Connections > Add new
  # connection > Zabbix), usando o usuario de API 'grafana'.
  # Para declara-lo aqui, descomentar e informar a senha via secret:
  #
  # additionalDataSources:
  #   - name: Zabbix
  #     type: alexanderzobnin-zabbix-datasource
  #     url: http://192.168.2.157:8080/api_jsonrpc.php
  #     jsonData:
  #       username: grafana
  #       trends: true

prometheus:
  prometheusSpec:
    retention: 15d

    # Sem estas tres linhas, o Prometheus so descobre ServiceMonitors,
    # PodMonitors e PrometheusRules que carreguem o label do release do Helm.
    # Recursos proprios seriam ignorados EM SILENCIO - sem erro, sem log.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Requer StorageClass default (local-path-provisioner)
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi

alertmanager:
  service:
    type: LoadBalancer
