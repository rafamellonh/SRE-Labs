# Pool em .200-.220, longe da faixa das VMs (.151-.157).
# Excluir esta faixa do DHCP do roteador.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.2.200-192.168.2.220
---
# O IPAddressPool define QUAIS IPs existem.
# O L2Advertisement define COMO sao anunciados na rede.
# Sem este segundo objeto, o IP e atribuido mas ninguem na LAN sabe
# chegar nele - o EXTERNAL-IP aparece mas nao responde.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-pool
