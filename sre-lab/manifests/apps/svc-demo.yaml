# Aplicacao de demonstracao instrumentada para Prometheus.
# PENDENTE - Fase 8.
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-demo
  namespace: apps
spec:
  replicas: 3
  selector:
    matchLabels:
      app: svc-demo
  template:
    metadata:
      labels:
        app: svc-demo
    spec:
      containers:
        - name: app
          image: ghcr.io/nginxinc/nginx-prometheus-exporter:1.3.0
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9113 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: svc-demo
  namespace: apps
  labels:
    app: svc-demo
spec:
  selector:
    app: svc-demo
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9113, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: svc-demo
  namespace: apps
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: svc-demo
  endpoints:
    - port: metrics
      interval: 15s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: svc-demo
  namespace: apps
spec:
  ingressClassName: nginx
  rules:
    - host: demo.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-demo
                port:
                  number: 80
