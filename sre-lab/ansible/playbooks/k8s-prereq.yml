# Prepara os nos para o kubeadm.
# NAO foi usado na construcao original (os prereqs foram feitos a mao),
# mas serve para reconstruir o lab e como material de estudo de EX294.

- name: Preparar nós Kubernetes
  hosts: k8s_cluster
  become: true

  tasks:
    # O kubelet se recusa a subir com swap ativo
    - name: Desabilitar swap em runtime
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Remover swap do fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    # Sem br_netfilter, o trafego entre pods na bridge nao passa pelas
    # regras de iptables e o Service ClusterIP nao funciona
    - name: Carregar módulos de kernel
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Ativar módulos agora
      modprobe:
        name: "{{ item }}"
      loop: [overlay, br_netfilter]

    - name: Parâmetros sysctl
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
      notify: reload sysctl

    # Faltam no Ubuntu Server minimal e travam o preflight do kubeadm
    - name: Instalar dependências do preflight
      apt:
        name: [conntrack, socat, ethtool]
        state: present
        update_cache: true

    - name: Instalar containerd
      apt:
        name: containerd
        state: present

    - name: Gerar config do containerd
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    # kubelet e containerd precisam do MESMO cgroup driver.
    # Divergencia aqui e a causa raiz mais comum de no NotReady intermitente.
    - name: Ativar SystemdCgroup
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup\s*='
        line: '            SystemdCgroup = true'
      notify: restart containerd

    - name: Criar diretório de keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Chave do repositório Kubernetes
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key
        dest: /etc/apt/keyrings/k8s.asc

    - name: Repositório Kubernetes
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/k8s.asc] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /"
        filename: kubernetes

    - name: Instalar kubeadm, kubelet e kubectl
      apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: true

    # Evita que um apt upgrade quebre a compatibilidade com o control plane
    - name: Fixar versões
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

  handlers:
    - name: reload sysctl
      command: sysctl --system

    - name: restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true
