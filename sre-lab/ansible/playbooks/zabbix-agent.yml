# Instala e configura o Zabbix Agent 2 em toda a frota.
# Cobre Debian e RedHat family via ansible_os_family.
#
#   ansible-playbook playbooks/zabbix-agent.yml --check --diff --ask-pass --ask-become-pass
#   ansible-playbook playbooks/zabbix-agent.yml --ask-pass --ask-become-pass

- name: Instalar e configurar Zabbix Agent 2
  hosts: all
  become: true
  vars:
    zabbix_server: 192.168.2.157

  tasks:
    - name: Repositório Zabbix (Debian family)
      apt:
        deb: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_7.0-2+ubuntu24.04_all.deb
      when: ansible_os_family == 'Debian'

    - name: Repositório Zabbix (RedHat family)
      dnf:
        name: https://repo.zabbix.com/zabbix/7.0/rhel/9/x86_64/zabbix-release-7.0-2.el9.noarch.rpm
        disable_gpg_check: true
      when: ansible_os_family == 'RedHat'

    # O modulo generico 'package' nao repassa update_cache ao APT de forma
    # confiavel. Sem estas duas tasks, o repo e adicionado mas o indice nunca
    # e lido, e a instalacao falha com "No package matching".
    - name: Atualizar cache do APT
      apt:
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Atualizar cache do DNF
      dnf:
        update_cache: true
      when: ansible_os_family == 'RedHat'

    - name: Instalar zabbix-agent2
      package:
        name: zabbix-agent2
        state: present

    - name: Configurar o agente
      template:
        src: ../templates/zabbix_agent2.conf.j2
        dest: /etc/zabbix/zabbix_agent2.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart zabbix-agent2

    - name: Habilitar e iniciar o serviço
      systemd:
        name: zabbix-agent2
        state: started
        enabled: true

  handlers:
    - name: restart zabbix-agent2
      systemd:
        name: zabbix-agent2
        state: restarted
